<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="container">
      <div class="top-nav fade-in-up">
        <div>
          <a href="./index.html" class="back-link">← 뒤로가기</a>
        </div>
        <div class="top-nav-right">
          <button>
            <img src="/public/fa-moon.png" alt="다크모드" />
          </button>
          <a href="#">사용 가이드</a>
        </div>
      </div>

      <header class="header-area fade-in-up">
        <h1 class="portfolio-title">React 프로젝트</h1>
        <p class="portfolio-subtitle">React로 개발한 프론트엔드 프로젝트들</p>
      </header>

      <div class="projects-container fade-in-up">
        <div class="project-card">
          <div class="project-header">
            <h2 class="project-title">프로젝트가 아직 없습니다</h2>
            <span class="project-badge">준비중</span>
          </div>
          <p class="project-description">
            React 프로젝트를 진행 중입니다. 곧 추가될 예정입니다.
          </p>
          <div class="project-images">
            <!-- 이미지를 여기에 추가하세요 -->
          </div>
        </div>
      </div>

      <footer>
        <p>@2026 01.14 Portfolio. All rights reserved.</p>
        <p>깃허브 링크</p>
      </footer>
    </main>

    <!-- 이미지 확대 모달 -->
    <div id="imageModal" class="image-modal">
      <img id="modalImage" class="image-modal-content" src="" alt="확대된 이미지" />
    </div>

    <script>
      function openImageModal(imageSrc) {
        const modal = document.getElementById('imageModal');
        const modalImg = document.getElementById('modalImage');
        modalImg.src = imageSrc;
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeImageModal() {
        const modal = document.getElementById('imageModal');
        modal.classList.remove('active');
        document.body.style.overflow = 'auto';
      }

      // 모달 배경 클릭 시 닫기
      window.addEventListener('DOMContentLoaded', function() {
        const modal = document.getElementById('imageModal');
        if (modal) {
          modal.addEventListener('click', function(e) {
            if (e.target === modal) {
              closeImageModal();
            }
          });
        }

        // ESC 키로 닫기
        document.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') {
            closeImageModal();
          }
        });
      });
    </script>
  </body>
</html>
