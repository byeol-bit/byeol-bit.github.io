<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <main class="container">
      <div class="top-nav fade-in-up">
        <div></div>
        <div class="top-nav-right">
          <button>
            <img src="/public/fa-moon.png" alt="다크모드" />
          </button>
          <a href="https://github.com/byeol-bit/byeol-bit.github.io.git" target="_blank">사용 가이드</a>
        </div>
      </div>

      <header class="header-area fade-in-up">
        <a href="/">
          <h1 class="portfolio-title">Portfolio</h1>
        </a>
        <p class="portfolio-subtitle">정체되지 않고 나아가고싶은 한 개발자의 포트폴리오 페이지입니다.</p>
      </header>

      <div class="main-area fade-in-up">
        <div class="main-area-left profile-section">
          <div class="main-area-left-image">
            <img
              class="profile-image"
              src="/public/my_charactor.jpg"
              alt="메인 이미지"
            />
          </div>
          <h2 class="profile-name">박상선</h2>
          <p class="profile-age">만 32세</p>
          
          <div class="action-buttons">
            <button style="background-color: #fff170;"
              onClick="window.open('https://open.kakao.com/o/sshmMrbi', '_blank')"
            >
              <img
                src="/public/fa-openchat.png"
                alt="깃허브"
                width="20"
                height="20"
              />
              1:1채팅
            </button>
            <button
              onClick="window.open('https://github.com/byeol-bit', '_blank')"
            >
              <img
                src="/public/fa-github.png"
                alt="깃허브"
                width="20"
                height="20"
              />
              byeol-bit
            </button>
            </div>
          <div class="profile-divider"></div>
          
          <div class="profile-education">
            <h3 class="profile-section-title">학력</h3>
            <div class="education-item">
              <p class="education-school">OO고등학교</p>
            </div>
            <div class="education-item">
              <p class="education-school">
                OO대학교
                <span style="font-size: 11px; color: #4e5968;">(컴퓨터소프트웨어공학과)</span>
              </p>
            </div>
          </div>
          
          <div class="profile-divider"></div>
          
          <div class="profile-about">
            <h3 class="profile-section-title">소개</h3>
            <p class="about-text">
              -
            </p>
          </div>
          
          <div class="profile-divider"></div>
          
          <div class="profile-certificates">
            <h3 class="profile-section-title">자격증</h3>
            <div class="certificate-item">
              <img
                src="/public/fa-hrdk.png"
                alt="정보처리기사"
                class="certificate-icon"
              />
              <span class="certificate-name">정보처리기사</span>
            </div>
            <div class="certificate-item">
              <img
                src="/public/fa-sqld.png"
                alt="SQLD"
                class="certificate-icon"
              />
              <span class="certificate-name">SQLD</span>
            </div>
          </div>
        </div>
        <div class="main-area-right">
          <div class="main-area-right-top">
            <h3 class="career-title">경력</h3>
            <div class="career-chart-container">
              <div class="career-y-axis">
                <div class="y-axis-label">5년</div>
                <div class="y-axis-label">4년</div>
                <div class="y-axis-label">3년</div>
                <div class="y-axis-label">2년</div>
                <div class="y-axis-label">1년</div>
                <div class="y-axis-label">0년</div>
              </div>
              <div class="career-chart">
                <div class="career-grid-lines">
                  <div class="grid-line"></div>
                  <div class="grid-line"></div>
                  <div class="grid-line"></div>
                  <div class="grid-line"></div>
                  <div class="grid-line"></div>
                  <div class="grid-line"></div>
                </div>
                <div class="career-bar-item">
                  <div class="career-bar-wrapper">
                    <div class="career-bar" style="height: 33.3%;" data-value="1.5">
                      <span class="career-value">1.5년</span>
                    </div>
                  </div>
                  <div class="career-label">(주) OO</div>
                </div>
                <div class="career-bar-item">
                  <div class="career-bar-wrapper">
                    <div class="career-bar" style="height: 100%;" data-value="4.5">
                      <span class="career-value">4.5년</span>
                    </div>
                  </div>
                  <div class="career-label">(주) OO</div>
                </div>
              </div>
            </div>
          </div>
          <div class="main-area-right-bottom">
            
            <div class="stats-grid">
              <div class="stats-title">
                <img
                  src="/public/fa-project.png"
                  alt="교육"
                />
                프로젝트
              </div>
              <div 
                onClick="window.open('./dotnet.html', '_self')"
                class="stats-grid-dotnet stats-item"
              >
                <div class="stats-header">
                  C#
                  <i></i>
                </div>
                <div class="stats-content">4</div>
              </div>
              <div 
                onClick="window.open('./electron.html', '_self')"
                class="stats-grid-electron stats-item"
              >
                <div class="stats-header">
                  Electron
                  <i></i>
                </div>
                <div class="stats-content">1</div>
              </div>
              <div 
                onClick="window.open('./react.html', '_self')"
                class="stats-grid-react stats-item"
              >
                <div class="stats-header">
                  React
                  <i></i>
                </div>
                <div class="stats-content">0</div>
              </div>
              <div 
                onClick="window.open('./nextjs.html', '_self')"
                class="stats-grid-nextjs stats-item"
              >
                <div class="stats-header">
                  NextJS
                  <i></i>
                </div>
                <div class="stats-content">1</div>
              </div>

              <div class="stats-title">
                <img
                  src="/public/fa-education.png"
                  alt="교육"
                />
                교육
              </div>

              <div class="stats-grid-commits stats-item">
                <div class="stats-header">프로래머스 - 데브코스 9기/10회 수료중...</div>
              </div>
            </div>
            
          </div>
          
        </div>
      </div>

      <footer>
        <p>@2026 01.14에 HTML/CSS로만 제작된 페이지입니다.</p>
        <a href="https://github.com/byeol-bit" target="_blank">
          <i>byeol-bit</i>
        </a>
      </footer>
    </main>
  </body>
</html>
